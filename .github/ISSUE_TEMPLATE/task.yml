name: "Technical Task & Maintenance"
description: "Refactoring, DB migration, CI/CD, dependency updates, or documentation"
title: "[TASK]: "
labels: ["technical", "backend"]
body:
  - type: dropdown
    id: task_category
    attributes:
      label: "Task Category"
      options:
        - "Refactoring / Code Quality"
        - "Database & Migration"
        - "CI/CD & DevOps (AWS / Docker / GitHub Actions)"
        - "Dependencies Update"
        - "Testing & Coverage"
        - "API Documentation (OpenAPI/Swagger)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Task Description"
      placeholder: "Explain the technical scope and why this work is needed."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] All unit/integration tests pass
        - [ ] API documentation updated
        - [ ] No regression on core endpoints
    validations:
      required: true